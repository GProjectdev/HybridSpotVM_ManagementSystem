apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: ${APP}-source-only
  namespace: ${NS}
spec:
  resourceSelectors:
  - apiVersion: apps/v1
    kind: StatefulSet
    name: ${APP}
  placement:
    clusterAffinity:
      # User-owned workload placement. Keep target out until source is fenced and restore is prepared.
      clusterNames:
      - ${SOURCE_CLUSTER}
