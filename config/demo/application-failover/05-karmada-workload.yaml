apiVersion: v1
kind: Service
metadata:
  name: r50-fluidcr-demo
  namespace: fluidcr-realign-121040
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: r50-fluidcr-demo}
  ports:
  - {name: control, port: 8298}
  - {name: rendezvous, port: 29500}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: r50-fluidcr-demo
  namespace: fluidcr-realign-121040
  labels:
    migration.dcnlab.com/pv-metadata: enabled
spec:
  serviceName: r50-fluidcr-demo
  replicas: 0
  podManagementPolicy: Parallel
  updateStrategy: {type: OnDelete}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app: r50-fluidcr-demo}
  template:
    metadata:
      labels: {app: r50-fluidcr-demo}
      annotations:
        fluidcr.dcnlab.com/inject: "true"
        fluidcr.dcnlab.com/container: trainer
    spec:
      automountServiceAccountToken: false
      containers:
      - name: trainer
        image: docker.io/jeongseungjun/hybrid-spot-vm-system:resnet18_eval_v1
        command: [python, -u, /workspace/train_resnet18.py]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef: {fieldPath: metadata.name}
        - {name: RANK, value: "0"}
        - {name: WORLD_SIZE, value: "1"}
        - {name: LOCAL_RANK, value: "0"}
        - {name: MASTER_ADDR, value: r50-fluidcr-demo-0.r50-fluidcr-demo}
        - {name: MASTER_PORT, value: "29500"}
        - {name: NCCL_SOCKET_IFNAME, value: eth0}
        - {name: EVAL_MODEL, value: resnet50}
        - {name: EVAL_RUN_ID, value: r50-fluidcr-demo}
        - {name: EVAL_GOAL_STEPS, value: "30000"}
        - {name: EVAL_BATCH_SIZE, value: "32"}
        - {name: EVAL_SEED, value: "42"}
        - {name: EVAL_DATA_ROOT, value: /datasets/cifar10}
        - {name: FLUIDCR_DISTRIBUTED, value: "1"}
        - {name: FLUIDCR_REGISTRY_DIR, value: /tmp/fluidcr-workers}
        - {name: FLUIDCR_CHECKPOINT_DIR, value: /checkpoint}
        - {name: FLUIDCR_CHECKPOINT_PATH, value: '/checkpoint/$(POD_NAME)/latest.pt'}
        - {name: FLUIDCR_DISABLE_ENUMERATE_PATCH, value: "1"}
        - {name: FLUIDCR_DISABLE_ITER_PATCH, value: "1"}
        - {name: FLUIDCR_DISABLE_EPOCH_RANGE_PATCH, value: "1"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        ports:
        - {name: control, containerPort: 8298}
        - {name: rendezvous, containerPort: 29500}
        resources:
          requests: {cpu: "2", memory: 6Gi, nvidia.com/gpu: "1"}
          limits: {cpu: "4", memory: 12Gi, nvidia.com/gpu: "1"}
        readinessProbe:
          tcpSocket: {port: control}
          initialDelaySeconds: 30
        volumeMounts:
        - {name: checkpoint, mountPath: /checkpoint}
        - {name: script, mountPath: /workspace, readOnly: true}
        - {name: dataset, mountPath: /datasets/cifar10, readOnly: true}
        - {name: shm, mountPath: /dev/shm}
      volumes:
      - name: script
        configMap: {name: r50-fluidcr-demo-script}
      - name: shm
        emptyDir: {medium: Memory, sizeLimit: 1Gi}
  volumeClaimTemplates:
  - metadata: {name: dataset}
    spec:
      accessModes: [ReadOnlyMany]
      storageClassName: ""
      resources: {requests: {storage: 10Gi}}
  - metadata: {name: checkpoint}
    spec:
      accessModes: [ReadWriteMany]
      storageClassName: ""
      resources: {requests: {storage: 10Gi}}
