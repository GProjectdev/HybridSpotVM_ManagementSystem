apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-cloud-vm-collector
  namespace: hybridspot-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: public-cloud-vm-collector}
  template:
    metadata:
      labels: {app: public-cloud-vm-collector}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: manager
        image: jeongseungjun/hybrid-spot-vm-system:public-cloud-vm-collector-v6.0
        args: [--kubeconfig=/etc/karmada/kubeconfig]
        env:
        - name: POD_NAMESPACE
          value: hybridspot-system
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - name: karmada
          mountPath: /etc/karmada
          readOnly: true
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      volumes:
      - name: karmada
        secret: {secretName: hybridspot-karmada-kubeconfig}
---
