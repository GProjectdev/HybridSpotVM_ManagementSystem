apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-spot-risk-collector
  namespace: hybridspot-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: vm-spot-risk-collector}
  template:
    metadata:
      labels: {app: vm-spot-risk-collector}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: manager
        image: ghcr.io/gprojectdev/vm-spot-risk-collector:dev
        args: [--kubeconfig=/etc/karmada/kubeconfig]
        env:
        - name: POD_NAMESPACE
          value: hybridspot-system
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - name: karmada
          mountPath: /etc/karmada
          readOnly: true
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      volumes:
      - name: karmada
        secret: {secretName: hybridspot-karmada-kubeconfig}
---
