apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingtransitions.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: TrainingTransition
    listKind: TrainingTransitionList
    plural: trainingtransitions
    singular: trainingtransition
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              runRef:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 63
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
                required:
                - name
              mode:
                type: string
                enum:
                - PlannedReplacement
                - Preemption
                - Failover
                maxLength: 253
              workloadUID:
                type: string
                minLength: 1
                maxLength: 128
              executionID:
                type: string
                minLength: 1
                maxLength: 128
              worldSize:
                type: integer
                format: int64
                minimum: 1
                maximum: 128
              sourceCluster:
                type: string
                minLength: 1
                maxLength: 63
              targetCluster:
                type: string
                minLength: 1
                maxLength: 63
              capacityRef:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 253
                required:
                - name
                - uid
              targetAllocations:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: string
                  minLength: 1
                  maxLength: 253
              retireAllocations:
                type: array
                maxItems: 128
                items:
                  type: string
                  minLength: 1
                  maxLength: 253
              addedAllocations:
                type: array
                maxItems: 128
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                    market:
                      type: string
                      enum:
                      - spot
                      - on-demand
                      maxLength: 253
                    state:
                      type: string
                      enum:
                      - Prepare
                      maxLength: 253
                  required:
                  - name
                  - market
                  - state
              sourcePods:
                type: array
                minItems: 1
                maxItems: 128
                items:
                  type: object
                  properties:
                    rank:
                      type: integer
                      format: int64
                      minimum: 0
                    podName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    podUID:
                      type: string
                      minLength: 1
                      maxLength: 253
                    nodeName:
                      type: string
                      minLength: 1
                      maxLength: 253
                    nodeProvisionRef:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 253
                        uid:
                          type: string
                          minLength: 1
                          maxLength: 253
                        instanceID:
                          type: string
                          minLength: 1
                          maxLength: 253
                      required:
                      - name
                      - uid
                      - instanceID
                  required:
                  - rank
                  - podName
                  - podUID
                  - nodeName
              triggerID:
                type: string
                minLength: 1
                maxLength: 253
              emergencyDeadline:
                type: string
                format: date-time
                maxLength: 253
              workloadTemplateSHA256:
                type: string
                minLength: 64
                maxLength: 64
            required:
            - runRef
            - mode
            - workloadUID
            - executionID
            - worldSize
            - sourceCluster
            - targetCluster
            - capacityRef
            - targetAllocations
            - sourcePods
            - triggerID
            - workloadTemplateSHA256
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: transition intent and source identities are immutable
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
