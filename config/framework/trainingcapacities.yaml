apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingcapacities.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: TrainingCapacity
    listKind: TrainingCapacityList
    plural: trainingcapacities
    singular: trainingcapacity
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-validations:
            - rule: self.runRef == oldSelf.runRef && self.cluster == oldSelf.cluster
                && self.templateRef == oldSelf.templateRef && self.maxWorkers == oldSelf.maxWorkers
                && self.deadline == oldSelf.deadline
              message: capacity owner, target, template, limit and deadline are immutable
            properties:
              runRef:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 63
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
                required:
                - name
              cluster:
                type: string
                minLength: 1
                maxLength: 63
              templateRef:
                type: string
                minLength: 1
                maxLength: 63
              maxWorkers:
                type: integer
                format: int64
                minimum: 1
                maximum: 256
              deadline:
                type: string
                format: date-time
              allocations:
                x-kubernetes-validations:
                - rule: oldSelf.all(o, self.exists(a, a.name == o.name && a.market
                    == o.market && (o.state != 'Retire' || a.state == 'Retire')))
                  message: preserve allocation identity, market and irreversible retirement
                    intent
                - rule: oldSelf.all(o, !has(o.fenceOperationUID) || self.exists(a,
                    a.name == o.name && has(a.fenceOperationUID) && a.fenceOperationUID
                    == o.fenceOperationUID && (a.state == 'Fence' || a.state == 'Retire')))
                  message: preserve fence operation identity until retirement
                type: array
                maxItems: 256
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                - name
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 63
                    market:
                      type: string
                      enum:
                      - spot
                      - on-demand
                    state:
                      type: string
                      enum:
                      - Prepare
                      - Retain
                      - Fence
                      - Retire
                    fenceOperationUID:
                      type: string
                      minLength: 1
                  required:
                  - name
                  - market
                  - state
            required:
            - runRef
            - cluster
            - templateRef
            - maxWorkers
            - deadline
            - allocations
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
        required:
        - spec
