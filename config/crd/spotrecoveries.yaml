apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotrecoveries.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: SpotRecovery
    listKind: SpotRecoveryList
    plural: spotrecoveries
    singular: spotrecovery
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: SpotRecovery operations are immutable; create a new operation
            required:
            - policyRef
            - requestUID
            - operation
            - sourceCluster
            - targetCluster
            - workloadRef
            - trainingRuntimeRef
            - checkpointID
            - restoreRequestRef
            - oldNodeProvisionRef
            properties:
              policyRef:
                type: object
                required: [name, uid, generation]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
                  generation:
                    type: integer
                    format: int64
                    minimum: 1
              requestUID:
                type: string
                minLength: 1
                maxLength: 128
              operation:
                type: string
                minLength: 1
                maxLength: 128
              sourceCluster:
                type: string
                enum: [aws]
                minLength: 1
                maxLength: 253
              targetCluster:
                type: string
                minLength: 1
                maxLength: 253
              workloadRef:
                type: object
                required: [apiVersion, kind, name, uid]
                properties:
                  apiVersion:
                    type: string
                    enum: [apps/v1]
                  kind:
                    type: string
                    enum: [StatefulSet]
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
              trainingRuntimeRef:
                type: object
                required: [name, uid]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
              checkpointID:
                type: string
                minLength: 1
                maxLength: 253
              eventID:
                type: string
                minLength: 1
                maxLength: 256
              emergencyEventID:
                type: string
                minLength: 1
                maxLength: 256
              oldMarketType:
                type: string
                enum: [Spot, OnDemand]
              desiredMarketType:
                type: string
                enum: [Spot, OnDemand]
              restoreRequestRef:
                type: object
                required: [name, uid, generation]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
                  generation:
                    type: integer
                    format: int64
                    minimum: 1
              oldNodeProvisionRef:
                type: object
                required: [name, uid]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
              replacementNodeProvisionRef:
                type: object
                required: [name, uid]
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 253
                  uid:
                    type: string
                    minLength: 1
                    maxLength: 128
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, CleanupRequested, Completed, Rejected]
              observedGeneration:
                type: integer
                format: int64
              verifiedCheckpointID:
                type: string
              verifiedAt:
                type: string
                format: date-time
              replacementMode:
                type: string
                enum: [restore-verified-only, explicit-uid-bound-ref]
              silentGenerationAutoDelete:
                type: boolean
              message:
                type: string
