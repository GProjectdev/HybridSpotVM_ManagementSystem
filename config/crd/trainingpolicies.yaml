apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trainingpolicies.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: TrainingPolicy
    listKind: TrainingPolicyList
    plural: trainingpolicies
    singular: trainingpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Desired
      type: integer
      jsonPath: .status.policy.desiredWorkers
    - name: OD
      type: integer
      jsonPath: .status.policy.onDemandWorkers
    - name: Spot
      type: integer
      jsonPath: .status.policy.spotWorkers
    - name: Checkpoint
      type: string
      jsonPath: .status.checkpoint.lastMigrationName
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required: [workloadRef, sourceCluster, targetWorkers]
            x-kubernetes-validations:
            - rule: self.targetWorkers == oldSelf.targetWorkers
              message: targetWorkers is immutable; create a new TrainingPolicy for capacity shape changes
            - rule: '!has(self.policy) || !has(self.policy.minOnDemand) || self.policy.minOnDemand <= self.targetWorkers'
              message: policy.minOnDemand must be <= targetWorkers
            - rule: '!has(self.checkpoint) || !has(self.checkpoint.minIntervalSeconds) || !has(self.checkpoint.maxIntervalSeconds) || self.checkpoint.minIntervalSeconds <= self.checkpoint.maxIntervalSeconds'
              message: checkpoint minIntervalSeconds must be <= maxIntervalSeconds
            properties:
              workloadRef:
                type: object
                required: [apiVersion, kind, name, uid]
                properties:
                  apiVersion:
                    type: string
                    enum: [apps/v1]
                  kind:
                    type: string
                    enum: [StatefulSet]
                  name:
                    type: string
                    minLength: 1
                  uid:
                    type: string
                    minLength: 1
              sourceCluster:
                type: string
                minLength: 1
              expectedWorldSize:
                type: integer
                format: int64
                minimum: 0
              targetWorkers:
                type: integer
                format: int64
                minimum: 1
              runtimeRef:
                type: object
                properties:
                  name:
                    type: string
              riskProfileRef:
                type: object
                properties:
                  name:
                    type: string
              replacement:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
              policy:
                type: object
                properties:
                  alpha:
                    type: number
                    minimum: 0
                    maximum: 1
                  forecastHorizonSeconds:
                    type: integer
                    format: int64
                    minimum: 1
                  minOnDemand:
                    type: integer
                    format: int64
                    minimum: 0
                    default: 0
                  economics:
                    type: object
                    required: [enabled, lossCostPerEviction, observedAt]
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      lossCostPerEviction:
                        type: number
                        minimum: 0
                      observedAt:
                        type: string
                        format: date-time
                      maxAgeSeconds:
                        type: integer
                        minimum: 1
                        maximum: 86400
                        default: 600
              checkpoint:
                type: object
                properties:
                  minIntervalSeconds:
                    type: integer
                    format: int64
                    minimum: 1
                  maxIntervalSeconds:
                    type: integer
                    format: int64
                    minimum: 1
                  candidateIntervalSeconds:
                    type: array
                    items:
                      type: integer
                      format: int64
                      minimum: 1
                  riskBands:
                    type: array
                    items:
                      type: object
                      required: [maxLambdaPerHour, intervalSeconds]
                      properties:
                        maxLambdaPerHour:
                          type: number
                          minimum: 0
                        intervalSeconds:
                          type: integer
                          format: int64
                          minimum: 1
                  measuredCosts:
                    type: object
                    properties:
                      checkpointSeconds:
                        type: number
                        minimum: 0
                      copySeconds:
                        type: number
                        minimum: 0
                      observedAt:
                        type: string
                        format: date-time
                  resume:
                    type: boolean
                    default: true
              capacity:
                type: object
                properties:
                  aws:
                    type: object
                    properties:
                      karmadaCluster:
                        type: string
                      region:
                        type: string
                      availabilityZone:
                        type: string
                      instanceType:
                        type: string
                      hardwareType:
                        type: string
                        enum: [cpu, gpu]
                      nodeLabel:
                        type: string
                      ami:
                        type: string
                      subnetId:
                        type: string
                      vpcId:
                        type: string
                      securityGroupIds:
                        type: array
                        items:
                          type: string
                      iamInstanceProfile:
                        type: string
                      rootVolumeSizeGB:
                        type: integer
                        format: int64
                      credentialsRef:
                        type: object
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
          status:
            type: object
            properties:
              discovery:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              policy:
                type: object
                properties:
                  observedAt:
                    type: string
                    format: date-time
                  desiredWorkers:
                    type: integer
                    format: int64
                  onDemandWorkers:
                    type: integer
                    format: int64
                  spotWorkers:
                    type: integer
                    format: int64
                  alpha:
                    type: number
                  forecastHorizonSeconds:
                    type: integer
                    format: int64
                  lambdaPerHour:
                    type: number
                  checkpointIntervalSeconds:
                    type: integer
                    format: int64
                  costEvaluated:
                    type: boolean
                  intervalCostEvaluated:
                    type: boolean
                  provisioningBlocked:
                    type: boolean
                  reason:
                    type: string
                  message:
                    type: string
                  replacementRequiresUIDBoundOperation:
                    type: boolean
                  deleteRequiresExplicitRestoreEvidence:
                    type: boolean
              checkpoint:
                type: object
                x-kubernetes-preserve-unknown-fields: true
