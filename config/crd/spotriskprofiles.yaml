apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotriskprofiles.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: SpotRiskProfile
    listKind: SpotRiskProfileList
    plural: spotriskprofiles
    singular: spotriskprofile
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              endpoint:
                type: string
                pattern: ^https://
              staticLambdaPerHour:
                type: number
                minimum: 0
              maxAgeSeconds:
                type: integer
                format: int64
                minimum: 1
              pollSeconds:
                type: integer
                format: int64
                minimum: 1
              credentialSecretRef:
                type: object
                properties:
                  name:
                    type: string
                  key:
                    type: string
              provider:
                type: string
              region:
                type: string
              availabilityZone:
                type: string
              instanceType:
                type: string
            x-kubernetes-validations:
            - rule: has(self.endpoint) != has(self.staticLambdaPerHour)
              message: set exactly one of endpoint or staticLambdaPerHour
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              ready:
                type: boolean
              lambdaPerHour:
                type: number
              observedAt:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
              source:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              reason:
                type: string
              message:
                type: string
              error:
                type: string
              prices:
                type: object
                properties:
                  spotPricePerHour:
                    type: number
                  onDemandPricePerHour:
                    type: number
