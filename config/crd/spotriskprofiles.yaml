apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spotriskprofiles.training.dcnlab.com
spec:
  group: training.dcnlab.com
  names:
    kind: SpotRiskProfile
    listKind: SpotRiskProfileList
    plural: spotriskprofiles
    singular: spotriskprofile
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              endpoint:
                type: string
                pattern: ^https://
              trace:
                type: object
                required: [configMapRef, allowAvailabilityProxy, windowSamples, endIndex]
                properties:
                  configMapRef:
                    type: object
                    required: [name, key]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      key:
                        type: string
                        minLength: 1
                  allowAvailabilityProxy:
                    type: boolean
                    enum: [true]
                  windowSamples:
                    type: integer
                    format: int64
                    minimum: 2
                    maximum: 100000
                  endIndex:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 99999
              paperEstimator:
                type: object
                description: External paper-method SARIMA estimator feed. The in-cluster collector fetches feedEndpoint and records SARIMA metadata; the Python estimator service performs fitting outside the Go controller image.
                required: [method, feedEndpoint]
                properties:
                  method:
                    type: string
                    enum: [sarima]
                  feedEndpoint:
                    type: string
                    pattern: ^https://
                  rollingMeanHours:
                    type: integer
                    format: int64
                    minimum: 1
                    default: 3
                  retrainWindowWeeks:
                    type: integer
                    format: int64
                    minimum: 1
                    default: 4
                  seasonalPeriodHours:
                    type: integer
                    format: int64
                    minimum: 1
                    default: 24
              staticLambdaPerHour:
                type: number
                minimum: 0
              maxAgeSeconds:
                type: integer
                format: int64
                minimum: 1
              pollSeconds:
                type: integer
                format: int64
                minimum: 1
              credentialSecretRef:
                type: object
                properties:
                  name:
                    type: string
                  key:
                    type: string
              provider:
                type: string
              region:
                type: string
              availabilityZone:
                type: string
              instanceType:
                type: string
            x-kubernetes-validations:
            - rule: '(has(self.endpoint) ? 1 : 0) + (has(self.staticLambdaPerHour) ? 1 : 0) + (has(self.trace) ? 1 : 0) + (has(self.paperEstimator) ? 1 : 0) == 1'
              message: set exactly one of endpoint, staticLambdaPerHour, trace, or paperEstimator
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              ready:
                type: boolean
              lambdaPerHour:
                type: number
              observedAt:
                type: string
                format: date-time
              validUntil:
                type: string
                format: date-time
              source:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              reason:
                type: string
              message:
                type: string
              error:
                type: string
              prices:
                type: object
                properties:
                  spotPricePerHour:
                    type: number
                  onDemandPricePerHour:
                    type: number
