name: validate
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - run: go test -mod=readonly ./...
    - run: go vet ./...
    - run: go build -mod=readonly ./cmd/...
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install PyYAML==6.0.2
    - run: python -m unittest discover -s scripts -p 'test_*.py' -v
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [vm-spot-risk-collector, policy-manager, checkpoint-coordinator, spot-recovery-controller, training-runtime-collector, spot-watcher, placement-webhook]
    steps:
    - uses: actions/checkout@v4
    - run: docker build --build-arg COMPONENT=${{ matrix.component }} -t component:test .
    - run: docker run --rm component:test --help
